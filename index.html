<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Demo WebAR 3D Model</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Khai báo file 3D -->
      <a-assets>
        <a-asset-item id="myModel" src="indominus_rex_4k_textures_free (1).glb"></a-asset-item>
      </a-assets>

      <!-- Hiển thị mô hình khi quét Hiro Marker -->
      <a-marker preset="hiro">
        <a-entity gltf-model="#myModel" scale="0.2 0.2 0.2" position="0 0 0" rotation="0 0 0"></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
