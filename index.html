<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Demo</title>
    <!-- Import thư viện model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
      body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #ffffff; }
      model-viewer { width: 100%; height: 100%; }
    </style>
  </head>
  <body>

    <!-- Thay model.glb bằng chính xác tên file 3D con quái vật của bạn trên GitHub -->
    <model-viewer 
      src="mosasaurus.glb" 
      ar 
      ar-modes="scene-viewer webxr quick-look" 
      camera-controls 
      shadow-intensity="1"
      alt="Mô hình AR 3D">
    </model-viewer>

  </body>
</html>
