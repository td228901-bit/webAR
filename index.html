<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Demo WebAR - CCNN 4.0</title>
    <!-- Nạp thư viện A-Frame & AR.js từ CDN -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    <!-- Thẻ a-scene định nghĩa không gian AR, bật camera -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Định nghĩa Marker mặc định tên là "hiro" -->
      <a-marker preset="hiro">
        
        <a-assets>
          <!-- Nạp file mô hình 3D -->
          <a-asset-item id="myModel" src="indominus_rex_4k_textures_free (1).glb"></a-asset-item>
        </a-assets>
        
        <a-marker preset="hiro">
          <!-- Hiển thị mô hình 3D tại vị trí Marker -->
          <a-entity gltf-model="#myModel" scale="0.5 0.5 0.5" position="0 0 0"></a-entity>
        </a-marker>

        <!-- 2. Khối cầu màu xanh lam -->
        <a-sphere position="0.6 0.5 0" radius="0.4" material="color: #3b82f6;">
        </a-sphere>

        <!-- 3. Đoạn chữ nổi 3D -->
        <a-text value="CCNN 4.0 - WebAR" position="-0.8 1.2 0" color="#1e293b" scale="1.5 1.5 1.5"></a-text>

      </a-marker>

      <!-- Camera của thiết bị -->
      <a-entity camera></a-entity>

    </a-scene>
  </body>
</html>
