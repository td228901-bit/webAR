<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Markerless</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
      body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; }
      model-viewer { width: 100%; height: 100%; background-color: #f3f4f6; }
      .ar-button {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        padding: 14px 28px;
        background-color: #2563eb;
        color: white;
        border: none;
        border-radius: 30px;
        font-weight: bold;
        font-size: 16px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body>

    <!-- Bổ sung autoplay, animation-name, camera-orbit và min-camera-orbit -->
    <model-viewer 
      src="indomidibo.glb" 
      autoplay
      animation-name="*"
      ar 
      ar-modes="webxr scene-viewer quick-look" 
      camera-controls 
      touch-action="pan-y"
      camera-orbit="0deg 75deg 105%"
      min-camera-orbit="auto auto 0m"
      shadow-intensity="1">
      
      <button slot="ar-button" class="ar-button">
        📷 Xem trong không gian thực (AR)
      </button>

    </model-viewer>

  </body>
</html>
